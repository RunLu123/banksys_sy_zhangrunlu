name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: "/opt/banksys_sy_zhangrunlu"
          EXCLUDE: "/.git/,.github/,__pycache__/,*.pyc,models/*.pkl,models/*.joblib"

      - name: Build and run container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/banksys_sy_zhangrunlu

            # 端口自动回退
            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }
            PORT=""
            for p in $(seq 8888 8898); do
              if ! port_in_use "$p"; then PORT="$p"; break; fi
            done
            [ -z "$PORT" ] && { echo "预留端口区间已全部占用,部署中止"; exit 1; }
            echo ">> 部署到主机端口 $PORT"

            docker build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple -t banksys_sy_zhangrunlu:latest .
            docker rm -f banksys_sy_zhangrunlu 2>/dev/null || true
            docker run -d --name banksys_sy_zhangrunlu --restart unless-stopped -p ${PORT}:8888 banksys_sy_zhangrunlu:latest
            sleep 5
            curl -fsS "http://localhost:${PORT}/_stcore/health"
            echo ">> 部署成功: http://${{ secrets.SSH_HOST }}:${PORT}"
